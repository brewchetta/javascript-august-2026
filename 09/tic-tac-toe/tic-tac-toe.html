<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>

    <script defer src="tic-tac-toe.js"></script>

    <style>
        #board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
        }

        #board div {
            border: solid black 2px;
        } 
    </style>
</head>
<body>

    <h1>Tic Tac Toe</h1>
    
    <div id="board">

        <div id="square-1-1" class="row-1 col-1 diag-1"></div>
        <div id="square-1-2" class="row-1 col-2"></div>
        <div id="square-1-3" class="row-1 col-3 diag-2"></div>
        <div id="square-2-1" class="row-2 col-1"></div>
        <div id="square-2-2" class="row-2 col-2 diag-1 diag-2"></div>
        <div id="square-2-3" class="row-2 col-3"></div>
        <div id="square-3-1" class="row-3 col-1 diag-2"></div>
        <div id="square-3-2" class="row-3 col-2"></div>
        <div id="square-3-3" class="row-3 col-3 diag-1"></div>

    </div>
    
</body>
</html>
